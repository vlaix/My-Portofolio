[phases.setup]
nixPkgs = ["php83", "php83Extensions.pdo_sqlite", "php83Extensions.pdo_mysql", "php83Extensions.mbstring", "php83Extensions.openssl", "nodejs_20"]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci || npm install",
    "npm run build"
]

[start]
cmd = "bash start.sh"
